name: Refresh from WR

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1' # every Monday, 05:17 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - name: Commit changes
        run: |
          if git diff --quiet -- data/; then
            echo "Nessuna modifica."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/changelog.json
          git commit -m "$(node -p "require('./data/changelog.json')[0].summary")"
          git push
